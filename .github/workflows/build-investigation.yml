name: Build source for investigation

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - '.github/workflows/build-investigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish helper using Microsoft's supported Windows projection
        shell: pwsh
        run: |
          & ./source/build.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/publish"
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          $testProject = Join-Path $env:GITHUB_WORKSPACE 'source/HelperTests.csproj'
          dotnet publish $testProject --configuration Release --runtime win-x64 --self-contained true --output test-runner
          if ($LASTEXITCODE -ne 0) { throw 'Test runner publish failed' }
          Copy-Item -LiteralPath test-runner/HelperTests.exe,test-runner/HelperTests.dll,test-runner/HelperTests.deps.json,test-runner/HelperTests.runtimeconfig.json -Destination publish/
          $report = Get-ChildItem -LiteralPath publish -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash,$_.Name
          }
          $report | Set-Content -LiteralPath publish/SHA256SUMS.txt
          @(
            'INVESTIGATION BUILD 0.4.0 - NOT AN APPROVED RELEASE',
            "Source commit: $env:GITHUB_SHA",
            "Build run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            'The controller reader now uses the official Microsoft C#/WinRT projection.',
            'Self-contained .NET runtime files are included; no global runtime installation is required.',
            'The legacy manually allocated COM buffers and vtable delegates have been removed.',
            'The helper has not been run by this workflow. Local hardware testing and scanning are still required.'
          ) | Set-Content -LiteralPath publish/READ-FIRST.txt
          Get-FileHash -LiteralPath publish/Groundwork-Joystick-Helper.exe,publish/Groundwork-Joystick-Helper.dll
      - name: Store unreviewed investigation build
        uses: actions/upload-artifact@v7
        with:
          name: investigation-0.4.0-not-a-release
          path: publish/
          if-no-files-found: error
          retention-days: 7

